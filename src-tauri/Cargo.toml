[package]
name = "teledrive"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "teledrive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grammers-client = "0.10.0"
grammers-session = "0.10.0"
# Pin: glass_pumpkin 2.0.0-rc1 rompe grammers-crypto 0.10.0 (migró a num-bigint 0.5)
glass_pumpkin = "=2.0.0-rc0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
thiserror = "2.0.21"
tauri-plugin-dialog = "2.8.1"
libsql = "0.9"
sha2 = "0.11.0"
uuid = { version = "1.28.0", features = ["v4"] }
base64 = "0.22"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
